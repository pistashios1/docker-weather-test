[project]
name = "weather-lookup"
version = "1.0.0"
description = "Weather dashboard backed by Flask and Open-Meteo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Flask==3.1.3",
    "requests==2.34.2",
]

[tool.vercel]
entrypoint = "app.weather_app:app"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pyflakes/pycodestyle errors, import order, bugbear, pyupgrade, and pylint's
# warning rules (this is where os.environ.get(..., 5) is caught).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PLW", "PLR0402"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Applies to `pytest --cov` (CI). 96% when this floor was set.
fail_under = 95
show_missing = true
skip_covered = true
